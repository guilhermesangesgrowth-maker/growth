<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Diagnóstico gratuito de maturidade de IA do Growth Hub: 10 perguntas, nota de 0 a 30, nível de maturidade e plano de ação.">
<meta name="theme-color" content="#F4F3F0">
<title>Diagnóstico de Maturidade de IA</title>
<style>
:root { color-scheme: light; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: coluna única alinhada à esquerda; tela de pergunta com número fantasma ao fundo; resultado em blocos de leitura rápida */
:root {
  --bg: #F4F3F0;
  --surface: #FFFFFF;
  --line: #DAD6D0;
  --fg: #141211;
  --muted: #5F5951;
  --accent: #FF6B00;
  --accent-fg: #141211;
  --accent-text: #B94700;
  --accent-soft: rgba(255, 107, 0, 0.1);
  --ghost: rgba(0, 0, 0, 0.045);
  --focus: #B94700;
  --ink: #0A0A0A;
  --grid: rgba(20, 18, 17, 0.07);
  --danger: #B3261E;
  --ink-fg: #F4F3F0;
  --ink-muted: #B5AEA5;
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.5;
  padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 720px; margin-inline: auto; }

.top {
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap;
  padding-bottom: 14px; border-bottom: 1px solid var(--line); margin-bottom: 28px;
  font-family: var(--display); font-weight: 600; text-transform: uppercase; letter-spacing: 0.12em; font-size: 14px;
}
.top .brand { color: var(--accent-text); }
.top .tag { color: var(--muted); }

h1, h2, h3 { font-family: var(--display); font-weight: 700; text-transform: uppercase; line-height: 0.98; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(2.2rem, 7.5vw, 3.4rem); letter-spacing: 0.005em; }
h1 em { font-style: normal; color: var(--accent-text); }
h2 { font-size: clamp(1.6rem, 4.8vw, 2rem); }
h3 { font-size: 1.15rem; letter-spacing: 0.02em; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
[tabindex="-1"]:focus { outline: none; }

.lead { font-size: 1.02rem; color: var(--muted); max-width: 56ch; margin: 20px 0 0; }
.facts { display: flex; flex-wrap: wrap; gap: 8px 22px; margin: 26px 0 0; padding: 0; list-style: none;
  font-family: var(--display); font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; font-size: 14px; color: var(--fg); }
.facts li::before { content: ""; display: inline-block; width: 8px; height: 8px; background: var(--accent); margin-right: 9px; transform: translateY(-1px); }

.btn {
  appearance: none; border: 0; cursor: pointer; font-family: var(--display); font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.08em; font-size: 1.05rem; line-height: 1; padding: 15px 22px; border-radius: 2px;
  background: var(--accent); color: var(--accent-fg); text-decoration: none; display: inline-block; text-align: center;
}
.btn:hover { filter: brightness(1.08); }
.btn[disabled] { opacity: 0.35; cursor: not-allowed; filter: none; }
.btn.ghost { background: transparent; color: var(--fg); box-shadow: inset 0 0 0 1px var(--line); }
.btn.ghost:hover { box-shadow: inset 0 0 0 1px var(--accent); filter: none; }
.start { margin-top: 32px; }

.sec { margin-top: 40px; }
.sec .label { font-family: var(--display); font-weight: 600; text-transform: uppercase; letter-spacing: 0.14em; font-size: 14px; color: var(--accent-text); margin: 0 0 14px; }
.areas { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 0; border-top: 1px solid var(--line); }
.areas div { padding: 14px 16px 14px 0; border-bottom: 1px solid var(--line); }
.areas b { display: block; font-family: var(--display); text-transform: uppercase; letter-spacing: 0.04em; font-size: 1.1rem; font-weight: 700; }
.areas span { color: var(--muted); font-size: 0.9rem; }
.get { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.get li { padding-left: 22px; position: relative; }
.get li::before { content: ""; position: absolute; left: 0; top: 0.62em; width: 10px; height: 2px; background: var(--accent); }

/* Pergunta */
.stage { position: relative; overflow: hidden; }
.bgnum { position: absolute; right: -6px; top: -14px; font-family: var(--display); font-weight: 700; font-size: clamp(6rem, 24vw, 10rem);
  line-height: 0.8; color: var(--ghost); pointer-events: none; user-select: none; }
.stage > .in { position: relative; z-index: 1; }
.progress { display: flex; gap: 4px; margin-bottom: 8px; }
.progress i { flex: 1; height: 4px; background: var(--line); }
.progress i.on { background: var(--accent); }
.count { font-family: var(--display); font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; font-size: 14px; color: var(--muted); display: flex; justify-content: space-between; margin-bottom: 28px; }
.eyebrow { font-family: var(--display); font-weight: 600; text-transform: uppercase; letter-spacing: 0.14em; font-size: 14px; color: var(--accent-text); margin: 0 0 10px; }
.opts { display: grid; gap: 10px; margin-top: 28px; border: 0; padding: 0; min-width: 0; }
.opt { position: relative; display: grid; grid-template-columns: 22px 1fr; gap: 14px; align-items: start; padding: 13px 14px; min-height: 50px; font-size: 0.97rem;
  background: var(--surface); border: 1px solid var(--line); border-radius: 2px; cursor: pointer; }
.opt:hover { border-color: var(--muted); }
.opt input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.opt .dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--muted); margin-top: 2px; display: grid; place-items: center; }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.sel .dot { border-color: var(--accent); }
.opt.sel .dot::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.opt:has(input:focus-visible) { outline: 2px solid var(--focus); outline-offset: 3px; }
.nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 30px; flex-wrap: wrap; }

/* Resultado */
.score { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-top: 18px; }
.score .num { font-family: var(--display); font-weight: 700; font-size: clamp(4rem, 16vw, 6rem); line-height: 0.8; color: var(--accent-text); font-variant-numeric: tabular-nums; }
.score .num small { font-size: 0.34em; color: var(--muted); margin-left: 4px; }
.score .lvl { padding-bottom: 6px; min-width: 0; }
.score .lvl h2 { font-size: clamp(1.7rem, 5.5vw, 2.3rem); }
.scale { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 26px; }
.scale div { border-top: 4px solid var(--line); padding-top: 8px; font-family: var(--display); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; font-size: 14px; color: var(--muted); }
.scale div.on { border-top-color: var(--accent); color: var(--fg); }
.scale small { display: block; font-family: var(--body); font-weight: 400; letter-spacing: 0; text-transform: none; font-size: 12.5px; }
.summary { margin: 20px 0 0; max-width: 58ch; font-size: 1rem; }
.next { margin: 14px 0 0; max-width: 58ch; color: var(--muted); }
.next b { color: var(--fg); font-weight: 600; }

.dims { display: grid; gap: 18px; }
.dim .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.dim .nm { font-family: var(--display); font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; font-size: 1.05rem; }
.dim .pt { font-family: var(--display); font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: 0.06em; }
.track { height: 10px; background: var(--line); margin-top: 6px; }
.fill { height: 100%; background: var(--accent); }

.opp { display: grid; gap: 0; border-top: 1px solid var(--line); }
.opp article { padding: 18px 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 1fr; gap: 6px; }
.opp article h3 { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.opp article h3 span { font-size: 14px; letter-spacing: 0.12em; color: var(--accent-text); font-weight: 600; }
.opp article p { margin: 0; color: var(--muted); max-width: 60ch; }
.opp article.strength h3 span { color: var(--muted); }

.cta { margin-top: 44px; padding: 30px 24px 28px; background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--accent); }
.cta p { margin: 14px 0 0; color: var(--muted); max-width: 54ch; }
.cta .btns { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 24px; }
.again { margin-top: 28px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.again .ok { color: var(--muted); font-size: 0.95rem; }
.foot { margin-top: 56px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.85rem; }

@media (max-width: 480px) {
  .btn { width: 100%; }
  .nav .btn { width: auto; flex: 1; }
  .scale small { display: none; }
  .cta { padding-inline: 18px; }
}
@media (prefers-reduced-motion: no-preference) {
  .fill { transition: width 0.6s ease; }
  .opt { transition: border-color 0.15s, background 0.15s; }
}

/* Growth Hub: marca, métricas, antes/agora, serviço e faixa final escura */
.top .brand { color: var(--fg); font-size: 17px; letter-spacing: 0.16em; }
.top .brand i { font-style: normal; color: var(--accent-text); }
.top a.tag { color: var(--fg); text-decoration: none; border-bottom: 2px solid var(--accent); padding-bottom: 1px; }
.metrics { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 36px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.metrics div { padding: 16px 10px 14px 0; min-width: 0; }
.metrics div + div { padding-left: 16px; border-left: 1px solid var(--line); }
.metrics b { display: block; font-family: var(--display); font-size: clamp(1.8rem, 7vw, 2.6rem); line-height: 1; font-weight: 700; }
.metrics b i { font-style: normal; color: var(--accent-text); }
.metrics span { color: var(--muted); font-size: 0.85rem; }
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.compare > div { padding: 16px; border: 1px solid var(--line); background: var(--surface); min-width: 0; }
.compare .now { border-color: var(--accent); background: var(--accent-soft); }
.compare h3 { margin-bottom: 8px; font-size: 1rem; letter-spacing: 0.14em; color: var(--muted); }
.compare .now h3 { color: var(--accent-text); }
.flow { margin: 0; font-size: 0.95rem; }
.sec .label::before, .cta .label::before { content: "+ "; }
.svc { border: 1px solid var(--line); background: var(--surface); padding: 18px 18px 16px; }
.svc .tg { font-family: var(--display); font-weight: 600; text-transform: uppercase; letter-spacing: 0.12em; font-size: 13px; color: var(--accent-text); }
.svc h3 { margin: 6px 0 8px; font-size: 1.4rem; }
.svc p { margin: 0; color: var(--muted); max-width: 56ch; }
.cta { background: var(--ink); color: var(--ink-fg); border: 0; border-top: 4px solid var(--accent); padding: 30px 24px 28px; }
.cta .label { font-family: var(--display); font-weight: 600; text-transform: uppercase; letter-spacing: 0.14em; font-size: 14px; color: var(--accent); margin: 0 0 12px; }
.cta h2 { color: var(--ink-fg); }
.cta p { color: var(--ink-muted); }
.cta .btn.ghost { color: var(--ink-fg); box-shadow: inset 0 0 0 1px #4a443e; }
.cta .btn.ghost:hover { box-shadow: inset 0 0 0 1px var(--accent); }
.foot a { color: var(--fg); }
@media (max-width: 480px) { .compare { grid-template-columns: 1fr; } .cta { padding-inline: 18px; } }

/* v6: grade com brilho laranja, badge, botões e escala de texto */
body { position: relative; }
.bg { position: absolute; left: 0; right: 0; top: 0; height: min(700px, 100%); z-index: 0; pointer-events: none;
  background:
    radial-gradient(65% 60% at 50% 0%, rgba(255, 107, 0, 0.30), rgba(255, 107, 0, 0) 72%),
    linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 44px 44px,
    linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 44px 44px;
  -webkit-mask-image: linear-gradient(#000 55%, transparent);
  mask-image: linear-gradient(#000 55%, transparent); }
.wrap { position: relative; z-index: 1; }

.badge { display: inline-flex; align-items: center; gap: 12px; max-width: 100%; margin-bottom: 22px; padding: 6px 20px 6px 7px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 999px; box-shadow: 0 10px 26px -12px rgba(255, 107, 0, 0.6); }
.ava { width: 46px; height: 46px; flex: none; border-radius: 50%; overflow: hidden; display: grid; place-items: center;
  background: var(--accent); color: var(--accent-fg); font-family: var(--display); font-weight: 700; font-size: 1.15rem; letter-spacing: 0.04em;
  box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }
.ava img { width: 100%; height: 100%; object-fit: cover; display: block; }
.who { display: grid; min-width: 0; line-height: 1.15; }
.who b { font-family: var(--display); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; font-size: 1.05rem; }
.who span { color: var(--muted); font-size: 0.8125rem; }
.badge.on-ink { background: rgba(255, 255, 255, 0.06); border-color: #4a443e; box-shadow: none; margin-bottom: 20px; }
.badge.on-ink .ava { box-shadow: 0 0 0 2px var(--ink), 0 0 0 4px var(--accent); }
.badge.on-ink .who b { color: var(--ink-fg); }
.badge.on-ink .who span { color: var(--ink-muted); }

.cta { background:
    radial-gradient(70% 90% at 100% 100%, rgba(255, 107, 0, 0.38), rgba(255, 107, 0, 0) 66%),
    linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px) 0 0 / 36px 36px,
    linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px) 0 0 / 36px 36px,
    var(--ink); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; padding: 0 26px; font-size: 1.05rem; line-height: 1; transition: transform 0.12s, box-shadow 0.12s; }
.btn.arrow::after { content: "\2192"; font-family: var(--body); font-weight: 600; font-size: 1.1em; }
.btn.back::before { content: "\2190"; font-family: var(--body); font-weight: 600; font-size: 1.1em; }
.btn:not(.ghost):not([disabled]):hover { filter: none; transform: translate(-2px, -2px); box-shadow: 4px 4px 0 var(--ink); }
.cta .btn:not(.ghost):not([disabled]):hover { box-shadow: 4px 4px 0 var(--ink-fg); }
.start .btn { min-width: 260px; min-height: 58px; font-size: 1.15rem; }
.nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.nav .btn { flex: none; }
.nav .btn.ghost { min-width: 120px; }
.nav #next { min-width: 190px; }
.cta .btns { display: flex; flex-wrap: wrap; gap: 12px; }
.cta .btn { min-height: 56px; }
.again .btn { min-height: 44px; padding: 0 18px; font-size: 0.95rem; }

.lead, .summary { font-size: 1.0625rem; text-wrap: pretty; }
.opt { font-size: 1rem; line-height: 1.4; }
.next, .opp article p, .svc p, .cta p { font-size: 0.9375rem; line-height: 1.55; text-wrap: pretty; }
.areas span { font-size: 0.9375rem; }
.metrics span, .foot, .again .ok { font-size: 0.875rem; }
.scale div { font-size: 0.875rem; }
.scale small { font-size: 0.8125rem; }
.top, .count, .eyebrow, .sec .label, .cta .label, .facts { font-size: 0.875rem; }

@media (max-width: 480px) {
  h1 { font-size: clamp(2.1rem, 9.5vw, 2.7rem); }
  .start .btn, .cta .btn { width: 100%; min-width: 0; }
  .cta .btns { display: grid; grid-template-columns: 1fr; }
  .nav { display: grid; grid-template-columns: 112px 1fr; }
  .nav .btn, .nav .btn.ghost, .nav #next { width: 100%; min-width: 0; padding: 0 14px; }
  .again { display: grid; grid-template-columns: 1fr 1fr; }
  .again .btn { width: 100%; padding: 0 10px; }
  .again .ok { grid-column: 1 / -1; }
  .who b { font-size: 1rem; }
}

/* v8: infográfico, barras, teia de aranha e cadastro */
.lead strong { color: var(--fg); font-weight: 700; }
.mtag { display: inline-block; font-family: var(--display); font-weight: 700; text-transform: uppercase; letter-spacing: 0.14em; font-size: 0.8125rem; padding: 4px 10px; background: var(--line); color: var(--fg); }
.mkt { display: grid; gap: 6px; }
.mrow { display: grid; gap: 16px; padding: 18px; border: 1px solid var(--line); background: var(--surface); }
.mrow.now { border-color: var(--accent); background: linear-gradient(var(--accent-soft), var(--accent-soft)), var(--surface); box-shadow: 6px 6px 0 var(--accent); }
.mrow.now .mtag { background: var(--accent); color: var(--accent-fg); }
.mrow .mtag { justify-self: start; }
.mdown { text-align: center; font-family: var(--display); font-size: 1.6rem; line-height: 1; color: var(--accent-text); padding: 4px 0 8px; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.steps li { display: flex; align-items: center; gap: 12px; font-weight: 500; position: relative; }
.steps li i { font-style: normal; flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 0.95rem; border: 2px dashed var(--muted); color: var(--muted); background: var(--surface); position: relative; z-index: 1; }
.mrow.now .steps li i { border: 2px solid var(--accent); background: var(--accent); color: var(--accent-fg); }
.mrow.before .steps li.end span { color: var(--muted); }
.mrow.now .steps li.end span { font-weight: 700; color: var(--accent-text); }
.mfoot { display: flex; align-items: center; gap: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.mfoot svg { flex: none; }
.mfoot p { margin: 0; font-size: 0.9375rem; color: var(--muted); }
.sp-flat { fill: none; stroke: var(--muted); stroke-width: 2; stroke-dasharray: 4 4; }
.sp-fdot { fill: var(--muted); }
.sp-up { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
.sp-udot { fill: var(--accent); }
@media (min-width: 600px) {
  .steps { flex-direction: row; gap: 0; }
  .steps li { flex: 1; flex-direction: column; text-align: center; gap: 10px; align-items: center; }
  .steps li + li::before { content: ""; position: absolute; top: 15px; right: 50%; width: 100%; border-top: 2px dashed var(--muted); }
  .mrow.now .steps li + li::before { border-top: 2px solid var(--accent); }
}

.bars { display: grid; gap: 14px; }
.bnote { margin: 0; font-size: 0.9375rem; color: var(--muted); }
.bnote b { color: var(--fg); }
.stack { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; }
.stack span { background: var(--tone); color: var(--accent-fg); font-family: var(--display); font-weight: 700; font-size: 1.15rem; text-align: center; padding: 8px 0; }
.brow { display: grid; gap: 4px; padding: 14px 0 6px; border-top: 1px solid var(--line); }
.bhead { display: flex; align-items: center; gap: 10px; }
.bhead b { font-family: var(--display); font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; font-size: 1.1rem; }
.bhead em { font-style: normal; margin-left: auto; font-family: var(--display); font-weight: 600; letter-spacing: 0.06em; color: var(--muted); font-size: 0.875rem; text-transform: uppercase; }
.sw { width: 14px; height: 14px; background: var(--tone); flex: none; }
.brow p { margin: 0; font-size: 0.9375rem; color: var(--muted); }
.pbar { display: flex; gap: 3px; margin-top: 8px; }
.pbar i { flex: 1; height: 12px; background: var(--tone); }
.pbar i:nth-child(3) { margin-right: 8px; }

.ex { border: 1px solid var(--line); background: var(--surface); padding: 18px; }
.exhead { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
.exscore { display: flex; align-items: baseline; gap: 6px; font-family: var(--display); }
.exscore b { font-size: 2.6rem; line-height: 1; color: var(--accent-text); font-weight: 700; }
.exscore small { color: var(--muted); font-size: 1.1rem; font-weight: 600; }
.exscore span { margin-left: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; font-size: 1.15rem; }
.exgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; align-items: center; margin-top: 8px; }
.radar { max-width: 360px; width: 100%; margin-inline: auto; min-width: 0; }
.rd { width: 100%; height: auto; display: block; overflow: visible; }
.rd-grid { fill: none; stroke: var(--line); stroke-width: 1; }
.rd-axis { stroke: var(--line); stroke-width: 1; }

function radarHtml(vals) {
  var cx = 170, cy = 148, R = 96, n = DIM_ORDER.length;
  function ang(i) { return -Math.PI / 2 + i * 2 * Math.PI / n; }
  function pt(i, rad) { return [cx + rad * Math.cos(ang(i)), cy + rad * Math.sin(ang(i))]; }
  function poly(v) { return DIM_ORDER.map(function (_, i) { var p = pt(i, R * v / 6); return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" "); }
  var rings = [2, 4, 6].map(function (v) { return '<polygon class="rd-grid" points="' + poly(v) + '"/>'; }).join("");
  var axes = DIM_ORDER.map(function (_, i) { var p = pt(i, R); return '<line class="rd-axis" x1="' + cx + '" y1="' + cy + '" x2="' + p[0].toFixed(1) + '" y2="' + p[1].toFixed(1) + '"/>'; }).join("");
  var area = DIM_ORDER.map(function (d, i) { var p = pt(i, R * vals[d] / 6); return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ");
  var dots = DIM_ORDER.map(function (d, i) { var p = pt(i, R * vals[d] / 6); return '<circle class="rd-dot" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="4.5"/>'; }).join("");
  var labels = DIM_ORDER.map(function (d, i) {
    var p = pt(i, R + 16), c = Math.cos(ang(i)), sn = Math.sin(ang(i));
    var anchor = c > 0.3 ? "start" : (c < -0.3 ? "end" : "middle");
    var y = sn < -0.6 ? p[1] - 22 : (sn > 0.6 ? p[1] + 10 : p[1] - 6);
    return '<text class="rd-lbl" text-anchor="' + anchor + '" x="' + p[0].toFixed(1) + '" y="' + y.toFixed(1) + '">' + esc(DIM_SHORT[d]) +
      '<tspan class="rd-val" x="' + p[0].toFixed(1) + '" dy="15">' + vals[d] + '/6</tspan></text>';
  }).join("");
  var rl = [2, 4, 6].map(function (v) { var p = pt(0, R * v / 6); return '<text class="rd-tick" x="' + (cx + 5) + '" y="' + (p[1] + 4).toFixed(1) + '">' + v + '</text>'; }).join("");
  return '<svg class="rd" viewBox="0 0 340 282" role="img" aria-label="Gráfico de teia de aranha com a pontuação de exemplo por área">' +
    rings + axes + '<polygon class="rd-area" points="' + area + '"/>' + dots + rl + labels + '</svg>';
}

function exampleHtml() {
  var vals = { estrategia: 3, marketing: 2, vendas: 4, dados: 2, pessoas: 5 };
  var total = 0;
  DIM_ORDER.forEach(function (d) { total += vals[d]; });
  var lv = levelFor(total), svc = SERVICES[lv.slug];
  var ranked = DIM_ORDER.slice().sort(function (a, b) { return vals[a] - vals[b] || DIM_ORDER.indexOf(a) - DIM_ORDER.indexOf(b); });
  var plan = ranked.slice(0, 3).map(function (d, i) {
    return '<li><span class="pn">' + (i + 1) + '</span><div><b>' + esc(DIMS[d]) + ' <em>' + vals[d] + '/6</em></b><p>' + esc(OPP[d]) + '</p></div></li>';
  }).join("");
  return '<div class="ex"><div class="exhead"><span class="mtag">Exemplo de resultado</span>' +
    '<div class="exscore"><b>' + total + '</b><small>/30</small><span>' + esc(lv.name) + '</span></div></div>' +
    '<div class="exgrid"><div class="radar">' + radarHtml(vals) + '</div>' +
    '<div class="plan"><p class="ptitle">Plano de ação</p><ol>' + plan + '</ol>' +
    '<p class="psvc"><b>Serviço indicado:</b> ' + esc(svc.name) + '</p></div></div>' +
    '<p class="exnote">Exemplo ilustrativo. O seu resultado usa as suas respostas.</p></div>';
}

function renderIntro() {
  app.innerHTML =
    '<p class="eyebrow">Diagnóstico gratuito de maturidade de IA</p>' +
    '<h1 data-focus>Sua IA gera <em>receita</em> ou só gera texto?</h1>' +
    '<p class="lead">Responda <strong>10 perguntas em 3 minutos</strong> e receba uma visão detalhada do uso de IA na sua operação, os gaps que travam a receita e um plano de ação para otimizar em <strong>7 dias</strong>!</p>' +
    '<div class="start"><button class="btn arrow" id="start" type="button">Começar diagnóstico</button></div>' +
    '<ul class="facts"><li>Resultados com Growth</li></ul>' +
    '<div class="metrics"><div><b><i>+</i>R$1Bi</b><span>de receita gerada</span></div><div><b><i>+</i>12</b><span>segmentos validados</span></div><div><b><i>+</i>30</b><span>clientes vendem mais com o método Growth 30D</span></div></div>' +
    '<section class="sec"><p class="label">O mercado mudou</p>' + marketHtml() + '</section>' +
    '<section class="sec"><p class="label">O que é avaliado</p>' + barsHtml() + '</section>' +
    '<section class="sec"><p class="label">O que você recebe</p>' + exampleHtml() + '</section>' +
    '<section class="sec endcta"><h2>Descubra a nota da sua IA</h2><p class="lead" style="margin-top:10px">São 3 minutos. O resultado aparece na hora.</p><div class="start"><button class="btn arrow" id="start2" type="button">Começar diagnóstico</button></div></section>';
}

function renderLead() {
  var d = state.leadDraft || {};
  var n = QUESTIONS.length, bars = "";
  for (var k = 0; k < n; k++) bars += '<i class="' + (k < GATE_BEFORE ? "on" : "") + '"></i>';
  function opts(list, cur) {
    return '<option value="">Selecione</option>' + list.map(function (t) { return '<option' + (cur === t ? " selected" : "") + '>' + esc(t) + '</option>'; }).join("");
  }
  var cargos = ["Dono, CEO ou sócio", "Diretor(a)", "Gerente", "Coordenador(a)", "Analista", "Consultor(a) ou freelancer", "Estudante", "Outro"];
  var portes = ["Só eu", "2 a 10 pessoas", "11 a 50 pessoas", "Mais de 50 pessoas"];
  function fld(id, label, control) {
    return '<div class="fld" id="fld-' + id + '"><label for="f-' + id + '">' + label + '</label>' + control + '<span class="err" id="err-' + id + '" role="alert"></span></div>';
  }
  app.innerHTML =
    '<div class="progress" aria-hidden="true">' + bars + '</div>' +
    '<div class="count"><span>Falta pouco</span><span>' + (n - GATE_BEFORE) + ' perguntas restantes</span></div>' +
    '<p class="eyebrow">Seu resultado está quase pronto</p>' +
    '<h2 data-focus>Cadastre-se para continuar</h2>' +
    '<p class="lead" style="margin-top:12px">Informe seus dados para seguir com as últimas perguntas e receber o diagnóstico completo.</p>' +
    '<form class="form" id="lead-form" novalidate>' +
    fld("nome", "Nome", '<input id="f-nome" name="nome" type="text" autocomplete="name" value="' + esc(d.nome || "") + '">') +
    '<div class="two">' +
    fld("email", "E-mail", '<input id="f-email" name="email" type="email" autocomplete="email" inputmode="email" value="' + esc(d.email || "") + '">') +
    fld("whats", "WhatsApp", '<input id="f-whats" name="whats" type="tel" autocomplete="tel" inputmode="tel" placeholder="(19) 99999-9999" value="' + esc(d.whatsapp || "") + '">') +
    '</div><div class="two">' +
    fld("cargo", "Cargo", '<select id="f-cargo" name="cargo">' + opts(cargos, d.cargo) + '</select>') +
    fld("porte", "Tamanho da empresa", '<select id="f-porte" name="porte">' + opts(portes, d.porte) + '</select>') +
    '</div>' +
    '<div class="fld" id="fld-consent"><label class="consent" for="f-consent"><input id="f-consent" name="consent" type="checkbox"' + (d.consent ? " checked" : "") + '><span>Concordo em receber o resultado e contatos sobre growth, conforme a LGPD.</span></label><span class="err" id="err-consent" role="alert"></span></div>' +
    '<p class="privacy">Sem spam. Você pode pedir a remoção dos seus dados quando quiser.</p>' +
    '<div class="nav"><button class="btn ghost back" id="backlead" type="button">Voltar</button><button class="btn arrow" id="submitlead" type="submit">Continuar</button></div>' +
    '</form>';
}

function readLead() {
  function v(id) { var el = document.getElementById(id); return el ? el.value.trim() : ""; }
  var c = document.getElementById("f-consent");
  return { nome: v("f-nome"), email: v("f-email"), whatsapp: v("f-whats"), cargo: v("f-cargo"), porte: v("f-porte"), consent: !!(c && c.checked) };
}

function validateLead(d) {
  var e = {};
  if (d.nome.length < 2) e.nome = "Informe seu nome.";
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(d.email)) e.email = "Informe um e-mail válido.";
  var digits = d.whatsapp.replace(/\D/g, "");
  if (digits.length < 10 || digits.length > 13) e.whats = "Informe um WhatsApp com DDD.";
  if (!d.cargo) e.cargo = "Escolha o seu cargo.";
  if (!d.porte) e.porte = "Escolha o tamanho da empresa.";
  if (!d.consent) e.consent = "Marque para continuar.";
  return e;
}

function showLeadErrors(errs) {
  ["nome", "email", "whats", "cargo", "porte", "consent"].forEach(function (k) {
    var f = document.getElementById("fld-" + k), m = document.getElementById("err-" + k);
    if (!f || !m) return;
    f.classList.toggle("bad", !!errs[k]);
    m.textContent = errs[k] || "";
  });
}

function renderQuestion() {
  var q = QUESTIONS[state.i], n = QUESTIONS.length, cur = state.answers[q.id];
  var bars = "";
  for (var k = 0; k < n; k++) bars += '<i class="' + (k <= state.i ? "on" : "") + '"></i>';
  var opts = q.opts.map(function (o, idx) {
    var sel = cur === idx;
    return '<label class="opt' + (sel ? " sel" : "") + '"><input type="radio" name="q" value="' + idx + '"' + (sel ? " checked" : "") + '><span class="dot"></span><span>' + esc(o.t) + '</span></label>';
  }).join("");
  var last = state.i === n - 1;
  app.innerHTML =
    '<div class="stage"><div class="bgnum" aria-hidden="true">' + pad(state.i + 1) + '</div><div class="in">' +
    '<div class="progress" aria-hidden="true">' + bars + '</div>' +
    '<div class="count"><span>Pergunta ' + (state.i + 1) + ' de ' + n + '</span><span>' + (q.dim ? esc(DIMS[q.dim]) : "Contexto") + '</span></div>' +
    '<p class="eyebrow">' + (q.dim ? esc(DIMS[q.dim]) : "Sobre você") + '</p>' +
    '<fieldset class="opts" style="margin-top:0"><legend style="padding:0"><h2 data-focus>' + esc(q.text) + '</h2></legend><div class="opts" style="margin-top:28px">' + opts + '</div></fieldset>' +
    '<div class="nav"><button class="btn ghost back" id="back" type="button">Voltar</button>' +
    '<button class="btn arrow" id="next" type="button"' + (cur === undefined ? " disabled" : "") + '>' + (last ? "Ver resultado" : "Próxima") + '</button></div>' +
    '</div></div>';
}

function renderResult() {
  var r = compute(), lv = r.level;
  var scale = LEVELS.map(function (l) {
    return '<div class="' + (l.slug === lv.slug ? "on" : "") + '">' + esc(l.name) + '<small>' + l.range + ' pontos</small></div>';
  }).join("");
  var dims = DIM_ORDER.map(function (d) {
    return '<div class="dim"><div class="row"><span class="nm">' + esc(DIMS[d]) + '</span><span class="pt">' + r.per[d] + ' / 6</span></div>' +
      '<div class="track"><div class="fill" style="width:' + (r.per[d] / 6 * 100) + '%"></div></div></div>';
  }).join("");

  var ranked = DIM_ORDER.slice().sort(function (a, b) {
    return r.per[a] - r.per[b] || DIM_ORDER.indexOf(a) - DIM_ORDER.indexOf(b);
  });
  var gaps = ranked.slice(0, 3);
  var best = ranked[ranked.length - 1];
  var opp = gaps.map(function (d, idx) {
    return '<article><h3><span>Prioridade ' + (idx + 1) + '</span>' + esc(DIMS[d]) + ' <span>' + r.per[d] + ' / 6</span></h3><p>' + esc(OPP[d]) + '</p></article>';
  }).join("");
  if (r.per[best] >= 4 && gaps.indexOf(best) === -1) {
    opp += '<article class="strength"><h3><span>Ponto forte</span>' + esc(DIMS[best]) + ' <span>' + r.per[best] + ' / 6</span></h3><p>' + esc(STRENGTH[best]) + '</p></article>';
  }

  var next = CONFIG.nextUrl
    ? '<a class="btn ghost" href="' + esc(CONFIG.nextUrl) + '" target="_blank" rel="noopener">' + esc(CONFIG.nextLabel) + '</a>' : "";

  app.innerHTML =
    '<p class="eyebrow" style="margin-bottom:0">' + (state.lead ? 'Resultado de ' + esc(state.lead.nome.split(" ")[0]) : 'Seu resultado') + '</p>' +
    '<div class="score"><div class="num" aria-label="Nota ' + r.total + ' de 30">' + r.total + '<small>/30</small></div>' +
    '<div class="lvl"><h2 data-focus>' + esc(lv.name) + '</h2></div></div>' +
    '<div class="scale">' + scale + '</div>' +
    '<p class="summary">' + esc(lv.summary) + '</p>' +
    '<p class="next"><b>Próximo passo:</b> ' + esc(lv.next) + '</p>' +
    '<section class="sec"><p class="label">Pontuação por área</p><div class="dims">' + dims + '</div></section>' +
    '<section class="sec"><p class="label">Onde agir primeiro</p><div class="opp">' + opp + '</div></section>' +
    '<section class="sec"><p class="label">Serviço indicado para o seu nível</p><div class="svc"><span class="tg">' + esc(SERVICES[lv.slug].tag) + '</span><h3>' + esc(SERVICES[lv.slug].name) + '</h3><p>' + esc(SERVICES[lv.slug].text) + '</p></div></section>' +
    '<section class="cta"><p class="label">Método Máquina de Receita</p><h2>Otimize a sua máquina de receita em até 30 dias</h2>' +
    '<p>Me chame no WhatsApp. Eu recebo a sua nota e o seu nível e a conversa começa com o diagnóstico em mãos.</p>' +
    '<div class="btns"><a class="btn arrow" id="cta" href="' + esc(waUrl(r)) + '" target="_blank" rel="noopener">Crescer agora!</a>' +
    '<a class="btn ghost" href="' + esc(CONFIG.hubUrl) + '#servicos" target="_blank" rel="noopener">Ver serviços</a>' + next + '</div></section>' +
    '<div class="again"><button class="btn ghost" id="copy" type="button">Copiar resumo</button><button class="btn ghost" id="redo" type="button">Refazer diagnóstico</button><span class="ok" id="ok" role="status"></span></div>';
}

function render() {
  if (state.view === "intro") renderIntro();
  else if (state.view === "q") renderQuestion();
  else if (state.view === "lead") renderLead();
  else renderResult();
}

app.addEventListener("change", function (e) {
  if (e.target.name !== "q") return;
  var q = QUESTIONS[state.i];
  state.answers[q.id] = parseInt(e.target.value, 10);
  var labels = app.querySelectorAll(".opt");
  for (var k = 0; k < labels.length; k++) labels[k].classList.toggle("sel", labels[k].contains(e.target));
  var nx = document.getElementById("next");
  if (nx) nx.disabled = false;
});

app.addEventListener("input", function (e) {
  var t = e.target;
  if (!t || !t.closest || !t.closest("#lead-form")) return;
  state.leadDraft = readLead();
});

app.addEventListener("submit", function (e) {
  if (e.target.id !== "lead-form") return;
  e.preventDefault();
  var d = readLead(), errs = validateLead(d);
  state.leadDraft = d;
  showLeadErrors(errs);
  var first = ["nome", "email", "whats", "cargo", "porte", "consent"].filter(function (k) { return errs[k]; })[0];
  if (first) { document.getElementById("f-" + first).focus(); return; }
  state.lead = d;
  sendLead("cadastro");
  go("q", GATE_BEFORE);
});

app.addEventListener("click", function (e) {
  var b = e.target.closest("button");
  if (!b) return;
  if (b.id === "start" || b.id === "start2") go("q", 0);
  else if (b.id === "backlead") go("q", GATE_BEFORE - 1);
  else if (b.id === "back") { if (state.i === 0) go("intro"); else go("q", state.i - 1); }
  else if (b.id === "next") {
    if (state.answers[QUESTIONS[state.i].id] === undefined) return;
    if (state.i === QUESTIONS.length - 1) { go("result"); sendLead("resultado"); }
    else if (state.i + 1 === GATE_BEFORE && !state.lead) go("lead");
    else go("q", state.i + 1);
  }
  else if (b.id === "redo") { state.answers = {}; go("intro"); }
  else if (b.id === "copy") {
    var r = compute();
    var txt = "Meu diagnóstico de maturidade de IA: " + r.total + "/30 (" + r.level.name + "). Faça o seu no Growth Hub";
    var ok = document.getElementById("ok");
    var done = function () { ok.textContent = "Resumo copiado."; };
    var fail = function () { ok.textContent = "Não foi possível copiar. Resumo: " + txt; };
    try { navigator.clipboard.writeText(txt).then(done, fail); } catch (err) { fail(); }
  }
});

render();
</script>
</body>
</html>
